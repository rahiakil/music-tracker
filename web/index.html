<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14080c">
  <title>Brishchik · Cue Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
  <div class="stage">
    <header class="brand">
      <img class="brand-mark" src="logo.png" alt="Brishchik">
      <div class="brand-copy">
        <p class="brand-name">Brishchik</p>
        <p class="brand-line">Shurti Natok · cue player</p>
      </div>
    </header>

    <div class="workspace">
      <div class="main-col">
        <section class="now" aria-live="polite">
          <p class="now-label">Cue</p>
          <h1 id="now-title">—</h1>
          <p id="now-meta" class="now-meta">Ready</p>
          <div class="progress" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="time-row">
            <span id="time-elapsed">0:00</span>
            <span id="time-total">0:00</span>
          </div>
          <div class="transport transport-3">
            <button id="btn-prev" class="btn-ghost" type="button" aria-label="Previous cue">Prev</button>
            <button id="btn-play" class="btn-play" type="button" aria-label="Play or pause">Play</button>
            <button id="btn-next" class="btn-ghost" type="button" aria-label="Next cue">Next</button>
          </div>
        </section>

        <section class="sequence-panel" aria-label="Play sequence">
          <div class="panel-head">
            <div>
              <h2>Sequence</h2>
              <p class="hint">9 fixed cues. Drop a music file onto a cue to swap it into that slot.</p>
            </div>
            <button id="btn-revert" class="btn-quiet" type="button">Revert</button>
          </div>
          <ol id="sequence" class="sequence"></ol>
        </section>
      </div>

      <aside class="library-panel" aria-label="Music library">
        <div class="panel-head">
          <div>
            <h2>Music files</h2>
            <p class="hint">Drag onto a cue tile to place it there</p>
          </div>
        </div>
        <div id="library" class="library"></div>
      </aside>
    </div>
  </div>

  <audio id="player" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
